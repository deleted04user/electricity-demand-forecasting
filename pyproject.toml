[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "electricity-demand-forecasting"
version = "0.2.1"
description = "Hourly electricity-demand forecasting research and a FastAPI backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["electricity", "demand", "forecasting", "xgboost", "fastapi"]
# requirements*.txt remain the lock-generation inputs. Keep these discoverable
# metadata declarations in sync; test_project_metadata.py checks the full sets.
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "openpyxl>=3.0.0",
    "holidays>=0.34",
    "joblib>=1.3.0",
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "python-dotenv>=1,<2",
    "xlrd>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.14,<1",
    "mypy>=1.18,<3",
    "pandas-stubs>=2.3,<4",
    "types-python-dateutil>=2.9,<3",
    "types-tzdata>=2025.2",
    "types-openpyxl>=3.1,<4",
    "pip-audit>=2.9,<3",
]
# Research includes the development tools, matching requirements-research.txt.
research = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.14,<1",
    "mypy>=1.18,<3",
    "pandas-stubs>=2.3,<4",
    "types-python-dateutil>=2.9,<3",
    "types-tzdata>=2025.2",
    "types-openpyxl>=3.1,<4",
    "pip-audit>=2.9,<3",
    "mlflow-skinny>=3.4,<4",
    "sqlalchemy>=2,<3",
    "alembic>=1.14,<2",
]
legacy = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "jupyter>=1.0.0",
    "streamlit>=1.28.0",
    "plotly>=5.17.0",
    "scipy>=1.11.0",
]

[project.urls]
Repository = "https://github.com/deleted04user/electricity-demand-forecasting"
Documentation = "https://github.com/deleted04user/electricity-demand-forecasting/blob/main/README.md"
Issues = "https://github.com/deleted04user/electricity-demand-forecasting/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["backend", "backend.*"]
exclude = ["backend.tests", "backend.tests.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["backend"]
branch = true
omit = ["backend/tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["backend"]
exclude = ["backend/tests/"]
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["joblib", "sklearn.*", "holidays.*", "xgboost.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["backend.settings", "backend.artifacts", "backend.api_models", "backend.service", "backend.diagnostics", "backend.main", "backend.evaluate"]
strict = true
