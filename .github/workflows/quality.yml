name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt
      - run: python -m pip install --require-hashes -r requirements-dev.lock.txt
      - name: Lint and format
        run: |
          python -m ruff check backend
          python -m ruff format --check backend
      - name: Check backend types
        run: python -m mypy backend
      - name: Test with branch coverage gate
        run: python -m pytest --cov=backend --cov-report=term-missing --cov-report=xml -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high

  dependencies:
    name: Audit Python dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt
      - run: python -m pip install --require-hashes -r requirements-dev.lock.txt
      - run: python -m pip_audit --strict --disable-pip -r requirements-api.lock.txt
      - run: python -m pip_audit --strict --disable-pip -r requirements-dev.lock.txt
      - run: python -m pip_audit --strict --disable-pip -r requirements.lock.txt

  containers:
    name: Build and smoke test containers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 180
      - name: Check dashboard and proxied API
        run: |
          curl --fail --retry 3 http://localhost:8080/ -o /dev/null
          curl --fail http://localhost:8000/api/health
          curl --fail http://localhost:8080/api/health
          curl --fail http://localhost:8080/api/meta
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down --volumes
